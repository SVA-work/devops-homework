
name: devops-compose

services:
  app:
    image: nginx:stable-alpine
    container_name: compose_app
    restart: unless-stopped

    volumes:
      - ./app/index.html:/usr/share/nginx/html/index.html:ro

    networks:
      - compose_net

  proxy:
    image: nginx:stable-alpine
    container_name: compose_proxy
    restart: unless-stopped

    depends_on:
      - app

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - compose_net

networks:
  compose_net:
    name: compose_net
    driver: bridge

